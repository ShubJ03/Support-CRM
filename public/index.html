<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shubham's CRM SupportDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Shubham's CRM SupportDesk</span>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">
          <span class="nav-icon">▦</span> Dashboard
        </button>
        <button class="nav-btn" data-page="tickets" onclick="navigate('tickets')">
          <span class="nav-icon">☰</span> All Tickets
        </button>
        <button class="nav-btn" data-page="create" onclick="navigate('create')">
          <span class="nav-icon">＋</span> New Ticket
        </button>
      </nav>
      <div class="theme-toggle">
        <button onclick="toggleTheme()" id="theme-btn">☀ Light</button>
      </div>

      <div class="sidebar-footer">
      <div class="sidebar-footer">
        <span class="version">v1.0</span>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <!-- DASHBOARD PAGE -->
      <div id="page-dashboard" class="page active">
        <header class="page-header">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-sub">Overview of all support activity</p>
          </div>
          <button class="btn btn-primary" onclick="navigate('create')">＋ New Ticket</button>
        </header>

        <div class="stats-grid">
          <div class="stat-card stat-total">
            <div class="stat-label">Total Tickets</div>
            <div class="stat-value" id="stat-total">—</div>
          </div>
          <div class="stat-card stat-open">
            <div class="stat-label">Open</div>
            <div class="stat-value" id="stat-open">—</div>
          </div>
          <div class="stat-card stat-progress">
            <div class="stat-label">In Progress</div>
            <div class="stat-value" id="stat-inProgress">—</div>
          </div>
          <div class="stat-card stat-closed">
            <div class="stat-label">Closed</div>
            <div class="stat-value" id="stat-closed">—</div>
          </div>
        </div>

        <div class="section-title">Recent Tickets</div>
        <div id="dashboard-tickets" class="ticket-list"></div>
      </div>

      <!-- ALL TICKETS PAGE -->
      <div id="page-tickets" class="page">
        <header class="page-header">
          <div>
            <h1 class="page-title">All Tickets</h1>
            <p class="page-sub" id="tickets-count">Loading...</p>
          </div>
          <button class="btn btn-primary" onclick="navigate('create')">＋ New Ticket</button>
        </header>

        <div class="toolbar">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" id="search-input" class="search-input" placeholder="Search by name, email, ID, or subject…" oninput="handleSearch()" />
            <button class="clear-btn" id="clear-search" onclick="clearSearch()" style="display:none">✕</button>
          </div>
          <div class="filter-tabs">
            <button class="filter-tab active" data-status="" onclick="setFilter(this, '')">All</button>
            <button class="filter-tab" data-status="Open" onclick="setFilter(this, 'Open')">Open</button>
            <button class="filter-tab" data-status="In Progress" onclick="setFilter(this, 'In Progress')">In Progress</button>
            <button class="filter-tab" data-status="Closed" onclick="setFilter(this, 'Closed')">Closed</button>
          </div>
        </div>

        <div id="tickets-list" class="ticket-list"></div>
      </div>

      <!-- CREATE TICKET PAGE -->
      <div id="page-create" class="page">
        <header class="page-header">
          <div>
            <h1 class="page-title">New Ticket</h1>
            <p class="page-sub">Fill in the details to open a support request</p>
          </div>
        </header>

        <div class="form-card">
          <div id="create-success" class="alert alert-success" style="display:none"></div>
          <div id="create-error" class="alert alert-error" style="display:none"></div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Customer Name <span class="required">*</span></label>
              <input type="text" id="f-name" class="form-input" placeholder="e.g. Rahul Sharma" />
            </div>
            <div class="form-group">
              <label class="form-label">Customer Email <span class="required">*</span></label>
              <input type="email" id="f-email" class="form-input" placeholder="rahul@example.com" />
            </div>
          </div>
          <div class="form-group">
  <label class="form-label">Priority <span class="required">*</span></label>
  <select id="f-priority" class="form-input">
    <option value="Low">Low</option>
    <option value="Medium" selected>Medium</option>
    <option value="High">High</option>
  </select>
</div>
          <div class="form-group">
            <label class="form-label">Issue Subject <span class="required">*</span></label>
            <input type="text" id="f-subject" class="form-input" placeholder="Short, clear description of the issue" />
          </div>
          <div class="form-group">
            <label class="form-label">Description <span class="required">*</span></label>
            <textarea id="f-description" class="form-input form-textarea" placeholder="Describe the issue in detail — steps to reproduce, what was expected, what happened…" rows="5"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" onclick="resetForm()">Clear</button>
            <button class="btn btn-primary" onclick="submitTicket()" id="submit-btn">Submit Ticket</button>
          </div>
        </div>
      </div>

      <!-- TICKET DETAIL PAGE -->
      <div id="page-detail" class="page">
        <header class="page-header">
          <button class="btn btn-ghost" onclick="navigate('tickets')">← Back</button>
        </header>
        <div id="ticket-detail-content"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
